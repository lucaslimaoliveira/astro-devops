apiVersion: apps/v1
kind: Deployment
metadata:
  name: astro-demo
  labels:
    app: astro-demo
  annotations:
    kubernetes.io/change-cause: "Falha proposital — imagem inexistente"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  minReadySeconds: 5
  progressDeadlineSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: astro-demo
  template:
    metadata:
      labels:
        app: astro-demo
        version: broken
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: nginx:versao-inexistente
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
